services:
  caddy:
    image: caddy:2-alpine
    container_name: financial-bi-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-localhost}
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-rafael}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - financial-bi
    restart: unless-stopped

  financial-bi:
    build: .
    container_name: financial-bi
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Mounts the whole directory (not just the file) so the telegram-bot's
      # atomic write-tmp-then-rename doesn't leave this container with a
      # dangling/orphaned single-file bind mount (ENOENT after a bot write).
      - ./data:/app/data:ro
    restart: unless-stopped

  telegram-bot:
    build: ./bot
    container_name: financial-bi-telegram-bot
    user: "${BOT_UID_GID:-1001:1001}"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATA_PATH=/app/data/master.json
      - STATE_DIR=/app/state
    volumes:
      # Mounts the whole directory (read-write) so the bot's atomic
      # write-tmp-then-rename doesn't break a single-file bind mount.
      - ./data:/app/data
      - ./bot/state:/app/state
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
